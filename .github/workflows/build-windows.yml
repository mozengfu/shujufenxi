name: Build Windows exe

on:
  workflow_dispatch:  # 手动触发
  push:
    tags:
      - 'v*'          # 推送 v1.0、v2.0 等标签时自动触发

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller pillow

      - name: Bundle VC++ runtime DLLs
        run: |
          $dlls = @('vcruntime140.dll', 'vcruntime140_1.dll', 'msvcp140.dll', 'msvcp140_1.dll', 'msvcp140_2.dll', 'concrt140.dll')
          mkdir vc_dlls -Force
          foreach ($dll in $dlls) {
            $p = "C:\Windows\System32\$dll"
            if (Test-Path $p) { Copy-Item $p vc_dlls\ }
          }
          dir vc_dlls
        shell: powershell

      - name: Generate .ico icon
        run: |
          python -c "
          from PIL import Image, ImageDraw, ImageFilter

          S = 256
          img = Image.new('RGB', (S, S), (44, 62, 80))
          draw = ImageDraw.Draw(img)

          for y in range(S):
              t = y / S
              r = int(44 + (41 - 44) * t)
              g = int(62 + (128 - 62) * t)
              b = int(80 + (185 - 80) * t)
              draw.line([(0, y), (S, y)], fill=(r, g, b))

          cx, cy = S // 2, S // 2
          bw, gap = 20, 18
          base_y = 200
          bars = [(cx - gap - bw, base_y - 64, cx - gap, base_y),
                  (cx - bw // 2, base_y - 115, cx + bw // 2, base_y),
                  (cx + gap, base_y - 90, cx + gap + bw, base_y)]
          for i, (x1, y1, x2, y2) in enumerate(bars):
              color = (39, 174, 96) if i == 1 else (255, 255, 255)
              draw.rounded_rectangle((x1, y1, x2, y2), radius=5, fill=color)

          pts = [(cx - gap - bw // 2, base_y - 56),
                 (cx, base_y - 122),
                 (cx + gap + bw // 2, base_y - 97)]
          draw.line(pts, fill=(142, 68, 173), width=3, joint='curve')
          for px, py in pts:
              draw.ellipse((px-4, py-4, px+4, py+4), fill=(142, 68, 173))

          tl, tr, tt, tb = 148, 235, 123, 200
          th = tb - tt
          draw.rectangle((tl, tt, tr, tt + th // 4), fill=(255,255,255,30))
          for c in range(4):
              x = tl + (tr - tl) * c // 3
              draw.line([(x, tt), (x, tb)], fill=(200,200,200))
          for r in range(5):
              y = tt + th * r // 4
              draw.line([(tl, y), (tr, y)], fill=(200,200,200))

          shadow = Image.new('RGBA', (S, S), (0,0,0,0))
          sd = ImageDraw.Draw(shadow)
          sd.rounded_rectangle((5, 5, S, S), radius=40, fill=(0,0,0,100))
          shadow = shadow.filter(ImageFilter.GaussianBlur(radius=6))

          mask = Image.new('L', (S, S), 0)
          md = ImageDraw.Draw(mask)
          md.rounded_rectangle((0, 0, S, S), radius=40, fill=255)
          masked = Image.new('RGBA', (S, S), (0,0,0,0))
          masked.paste(img, (0, 0), mask)
          final = Image.alpha_composite(shadow, masked)

          final.save('icon.ico', 'ICO', sizes=[(x, x) for x in [16, 32, 48, 64, 128, 256]])
          print('icon.ico generated')
          "

      - name: Build with PyInstaller
        run: |
          pyinstaller `
            --windowed `
            --name 数据分析系统 `
            --icon=icon.ico `
            --add-data "icon.ico;." `
            --add-binary "vc_dlls;." `
            --collect-all PyQt6 `
            --collect-all matplotlib `
            --hidden-import matplotlib.backends.backend_qtagg `
            --hidden-import matplotlib.backends.backend_agg `
            --exclude-module PyQt5 `
            --exclude-module PySide6 `
            --exclude-module IPython `
            --exclude-module jupyter `
            main.py

      - name: List build output
        run: |
          Write-Output "=== Build output ==="
          Get-ChildItem dist\* -Directory -Name
          $distDir = Get-ChildItem dist\* -Directory | Select-Object -First 1 -ExpandProperty Name
          Write-Output "=== Top-level files ==="
          Get-ChildItem "dist\$distDir" -Name | Select-Object -First 30
          Write-Output "=== MSVC DLLs ==="
          Get-ChildItem "dist\$distDir\vcruntime*.dll", "dist\$distDir\msvcp140*.dll" -Name -ErrorAction SilentlyContinue
        shell: powershell
        continue-on-error: true

      - name: Create installer with Inno Setup
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.5
        with:
          path: setup.iss
          options: /O+ /F"shujufenxi-setup"

      - name: Upload setup.exe
        uses: actions/upload-artifact@v4
        with:
          name: 数据分析系统-setup
          path: Output/shujufenxi-setup.exe

      - name: Upload zip fallback
        run: |
          $distDir = Get-ChildItem dist\* -Directory | Select-Object -First 1 -ExpandProperty FullName
          Compress-Archive -Path "$distDir\*" -DestinationPath shujufenxi.zip
        shell: powershell

      - name: Upload zip
        uses: actions/upload-artifact@v4
        with:
          name: 数据分析系统-zip
          path: shujufenxi.zip

      - name: Upload to Release (if tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Output/shujufenxi-setup.exe
            shujufenxi.zip
